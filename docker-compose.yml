services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    # PHP 容器由本專案的 Dockerfile 建置。
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # 將目前專案掛載到容器，修改程式後不必重新建置映像。
    volumes:
      - .:/var/www/html
    # 不在這裡固定 APP_ENV，平常由 .env 決定，測試時則可切換成 testing。

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
      MYSQL_USER: myapp
      MYSQL_PASSWORD: myapp
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
